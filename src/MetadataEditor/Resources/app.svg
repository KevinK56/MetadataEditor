<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Modern Vibrant Blue Gradient -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Blue Rounded Background with Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#blueGradient)" filter="url(#dropShadow)" />
  
  <!-- Subtle Sleek Border Glow -->
  <rect x="25" y="25" width="462" height="462" rx="103" ry="103" fill="none" stroke="#60A5FA" stroke-width="6" opacity="0.6" />

  <!-- Media Tag / Film Accent Graphic Line -->
  <rect x="110" y="112" width="292" height="12" rx="6" fill="#93C5FD" opacity="0.85" />
  <circle cx="132" cy="118" r="3" fill="#1E3A8A" />
  <circle cx="162" cy="118" r="3" fill="#1E3A8A" />
  <circle cx="192" cy="118" r="3" fill="#1E3A8A" />
  <circle cx="320" cy="118" r="3" fill="#1E3A8A" />
  <circle cx="350" cy="118" r="3" fill="#1E3A8A" />
  <circle cx="380" cy="118" r="3" fill="#1E3A8A" />

  <!-- White Text "NFO" -->
  <text x="256" y="258"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="118"
        font-weight="900"
        letter-spacing="6"
        fill="#FFFFFF"
        text-anchor="middle"
        dominant-baseline="middle">NFO</text>

  <!-- White Text "Edit" -->
  <text x="256" y="362"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="64"
        font-weight="700"
        letter-spacing="4"
        fill="#FFFFFF"
        text-anchor="middle"
        dominant-baseline="middle">Edit</text>
</svg>
